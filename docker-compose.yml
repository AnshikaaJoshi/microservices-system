services:
  mongodb:
    image: mongo:7
    container_name: microservices-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  nats:
    image: nats:2
    container_name: microservices-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data/jetstream
    ports:
      - "4222:4222"
      - "8222:8222"

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/microservices
      NATS_URL: nats://nats:4222
      NATS_USER: microservice
      NATS_PASSWORD: NatsSecure2026
    depends_on:
      - mongodb
      - nats

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: microservice
      NATS_PASSWORD: NatsSecure2026
    depends_on:
      - nats

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      USER_SERVICE_URL: http://user-service:5001
    depends_on:
      - user-service

volumes:
  mongodb_data:
  nats_data: